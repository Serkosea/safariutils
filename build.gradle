plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Machine-specific deploy defaults live in this ignored file. Command-line -P
// properties still win, so release and CI builds remain reproducible.
def localDeployProperties = new Properties()
def localDeployFile = file('gradle-local.properties')
if (localDeployFile.isFile()) {
	localDeployFile.withInputStream { localDeployProperties.load(it) }
	localDeployProperties.each { key, value ->
		if (!project.hasProperty(key.toString())) {
			project.ext.set(key.toString(), value.toString())
		}
	}
}

def deployRequested = gradle.startParameter.taskNames.any {
	it == 'deployToInstance'
}
def minecraftProfile = project.findProperty('minecraftProfile')
	?: (deployRequested ? project.findProperty('deployMinecraftProfile') : null)
	?: project.default_minecraft_profile
def privateApiBuild = project.findProperty('includePrivateApi')?.toString()?.toBoolean()
	|| (deployRequested && project.findProperty('deployPrivateApi')?.toString()?.toBoolean())
def extraBuild = privateApiBuild
	|| project.findProperty('extraBuild')?.toString()?.toBoolean()
	|| (deployRequested && project.findProperty('deployExtraBuild')?.toString()?.toBoolean())
def safeBuild = !extraBuild
def profileFile = file("gradle/versions/${minecraftProfile}.properties")
if (!profileFile.isFile()) {
	throw new GradleException("Unknown Minecraft profile '${minecraftProfile}' (${profileFile} not found)")
}
def profile = new Properties()
profileFile.withInputStream { profile.load(it) }
profile.each { key, value -> project.ext.set(key.toString(), value.toString()) }

sourceSets.main.java.srcDir("src/${minecraftProfile}/java")

// Keep variant outputs physically separate. Besides preserving all release jars,
// this prevents stale private classes or service registrations from surviving into
// a later incremental public build.
def buildVariant = privateApiBuild ? 'private' : (extraBuild ? 'extra' : 'safe')
layout.buildDirectory.set(layout.projectDirectory.dir(
	"build/${minecraftProfile}/${buildVariant}"))

def selectedReleaseVersion = privateApiBuild
	? project.private_release_version
	: project.release_version
version = "${selectedReleaseVersion}${extraBuild ? '-extra' : ''}+mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = privateApiBuild
		? "${project.archives_base_name}-private"
		: project.archives_base_name
}

loom {
	accessWidenerPath = file("src/main/resources/safariutils.accesswidener")
}

// Private API sources are opt-in and ignored by Git. Public builds never include
// them, even when they exist in the developer's working copy.
if (privateApiBuild) {
	def privateSource = file('private-api/src/main/java')
	def privateKeyFile = file('private-api/api-key.txt')
	def generatedPrivateSource = layout.buildDirectory.dir('generated/sources/privateApi/java')
	if (!privateSource.isDirectory()) {
		throw new GradleException("Private API sources requested but ${privateSource} does not exist")
	}
	if (!privateKeyFile.isFile()) {
		throw new GradleException("Private API build requested but ${privateKeyFile} does not exist")
	}
	sourceSets.main.java.srcDir(privateSource)
	sourceSets.main.java.srcDir(generatedPrivateSource)
	sourceSets.main.resources.srcDir('private-api/src/main/resources')

	def generatePrivateApiKey = tasks.register('generatePrivateApiKey') {
		inputs.file(privateKeyFile)
		outputs.dir(generatedPrivateSource)
		doLast {
			def keys = privateKeyFile.readLines('UTF-8')
				.collect { it.trim() }
				.findAll { !it.isEmpty() && !it.startsWith('#') }
				.unique()
			if (keys.isEmpty()) throw new GradleException('Private API key file is empty')
			def random = new java.security.SecureRandom()
			def encoded = keys.collect { key ->
				def pairs = key.chars().mapToObj { value ->
					int mask = random.nextInt(0x10000)
					"new int[]{${value ^ mask},${mask}}"
				}.toList().join(',')
				"new int[][]{${pairs}}"
			}.join(',')
			def target = generatedPrivateSource.get().file(
				'dev/serko/safariutils/privateapi/EmbeddedApiKey.java').asFile
			target.parentFile.mkdirs()
			target.setText("""package dev.serko.safariutils.privateapi;

final class EmbeddedApiKey {
	private static final int[][][] DATA = new int[][][]{${encoded}};
	private EmbeddedApiKey() {}
	static java.util.List<String> load() {
		return java.util.Arrays.stream(DATA).map(key -> {
			StringBuilder value = new StringBuilder(key.length);
			for (int[] pair : key) value.append((char) (pair[0] ^ pair[1]));
			return value.toString();
		}).toList();
	}
}
""", 'UTF-8')
		}
	}
	tasks.named('compileJava') { dependsOn generatePrivateApiKey }
}

repositories {
	maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation("com.terraformersmc:modmenu:${project.modmenu_version}")
}

processResources {
	def expandProps = [
		version: project.version,
		minecraft_depends: project.minecraft_depends,
		safe_build: safeBuild,
		developer_build: privateApiBuild
	]
	inputs.properties expandProps

	filesMatching(["fabric.mod.json", "safariutils-build.properties"]) {
		expand expandProps
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// --- Explicit deployment to the selected Prism test instance ---------------
def deployDirValue = project.findProperty('deployDir')
	?: project.findProperty("deployDir.${minecraftProfile}")
def deployDir = deployDirValue ? file(deployDirValue) : layout.buildDirectory.dir('undeployed').get().asFile
def deployAdditionalDirValue = project.findProperty('deployAdditionalDir')
	?: project.findProperty("deployAdditionalDir.${minecraftProfile}")
def deployAdditionalDir = deployAdditionalDirValue ? file(deployAdditionalDirValue) : null
def deployConfigSourceValue = project.findProperty('deployConfigSource')
	?: project.findProperty("deployConfigSource.${minecraftProfile}")
def deployConfigTargetValue = project.findProperty('deployConfigTarget')
	?: project.findProperty("deployConfigTarget.${minecraftProfile}")

tasks.register('deployToInstance') {
	description = 'Copy the built mod jar to configured Prism instances and mirror Safari Utils config one-way.'
	group = 'fabric'
	dependsOn tasks.named('jar')
	onlyIf {
		if (deployDirValue && deployDir.isDirectory()) return true
		logger.lifecycle('deployToInstance skipped: set -PdeployDir=<mods folder> or define it in local Gradle properties')
		return false
	}
	doLast {
		def destinations = [deployDir]
		if (deployAdditionalDir != null) destinations.add(deployAdditionalDir)
		for (def destination : destinations) {
			if (!destination.isDirectory()) {
				throw new GradleException("Deploy mods folder does not exist: ${destination}")
			}
			delete fileTree(destination) { include 'safariutils-*.jar' }
			copy {
				from tasks.named('jar').get().archiveFile
				into destination
			}
			logger.lifecycle("deployToInstance -> ${destination}")
		}
		if (deployConfigSourceValue && deployConfigTargetValue) {
			def source = file(deployConfigSourceValue)
			def target = file(deployConfigTargetValue)
			if (!source.isDirectory()) {
				throw new GradleException("Main Safari Utils config folder does not exist: ${source}")
			}
			project.sync {
				from source
				into target
			}
			logger.lifecycle("Safari Utils config mirrored one-way: ${source} -> ${target}")
		}
	}
}
