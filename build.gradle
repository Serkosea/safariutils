plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Machine-specific deploy defaults live in this ignored file. Command-line -P
// properties still win, so release and CI builds remain reproducible.
def localDeployProperties = new Properties()
def localDeployFile = file('gradle-local.properties')
if (localDeployFile.isFile()) {
	localDeployFile.withInputStream { localDeployProperties.load(it) }
	localDeployProperties.each { key, value ->
		if (!project.hasProperty(key.toString())) {
			project.ext.set(key.toString(), value.toString())
		}
	}
}

def deployRequested = gradle.startParameter.taskNames.any {
	it == 'DeployBuilds'
}
def minecraftProfile = project.findProperty('minecraftProfile')
	?: (deployRequested ? project.findProperty('deployMinecraftProfile') : null)
	?: project.default_minecraft_profile
def developerBuild = project.findProperty('developerBuild')?.toString()?.toBoolean()
	|| (deployRequested && project.findProperty('deployDeveloperBuild')?.toString()?.toBoolean())
if (project.findProperty('includePrivateApi')?.toString()?.toBoolean()) {
	throw new GradleException('Private edition retired in v3. API is included in every edition; use extraBuild or developerBuild if required.')
}
def extraBuild = developerBuild
	|| project.findProperty('extraBuild')?.toString()?.toBoolean()
	|| (deployRequested && project.findProperty('deployExtraBuild')?.toString()?.toBoolean())
def safeBuild = !extraBuild
def profileFile = file("gradle/versions/${minecraftProfile}.properties")
if (!profileFile.isFile()) {
	throw new GradleException("Unknown Minecraft profile '${minecraftProfile}' (${profileFile} not found)")
}
def profile = new Properties()
profileFile.withInputStream { profile.load(it) }
profile.each { key, value -> project.ext.set(key.toString(), value.toString()) }
// SDL-era profiles need a newer loader; explicit test overrides still win.
if (minecraftProfile == '26.3' && !gradle.startParameter.projectProperties.containsKey('loader_version')) {
	project.ext.set('loader_version', '0.20.1')
}

sourceSets.main.java.srcDir("src/${minecraftProfile}/java")
if(minecraftProfile != "26.3") sourceSets.main.java.srcDir("src/compat-pre26.3/java")

// Keep variant outputs physically separate. Besides preserving all release jars,
// this prevents stale private classes or service registrations from surviving into
// a later incremental public build.
def buildVariant = developerBuild ? 'developer'
	: (extraBuild ? 'extra' : 'safe')
layout.buildDirectory.set(layout.projectDirectory.dir(
	"build/${minecraftProfile}/${buildVariant}"))

def selectedReleaseVersion = project.release_version
def variantSuffix = developerBuild ? '-developer'
	: (extraBuild ? '-extra' : '')
version = "${selectedReleaseVersion}${variantSuffix}+mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	accessWidenerPath = file(minecraftProfile == "26.3" ? "src/26.3/resources/safariutils.accesswidener" : "src/main/resources/safariutils.accesswidener")
}

// Key-free API and party networking are shared. Developer testing stays isolated.
if (developerBuild) {
	sourceSets.main.java.srcDir('src/developer/java')
	sourceSets.main.resources.srcDir('src/developer/resources')
}

repositories {
    maven { url = "https://maven.azureaaron.net/releases"; content { includeModule "net.azureaaron", "render-chest" } }
	maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/' }
}

dependencies {
    if (profile.getProperty("render_chest_version")) { include implementation("net.azureaaron:render-chest:${profile.render_chest_version}") }
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation("com.terraformersmc:modmenu:${project.modmenu_version}")
}

processResources {
    if(minecraftProfile == "26.3") filesMatching("safariutils.accesswidener") { filter { line -> line.replace("com/mojang/blaze3d/pipeline/RenderPipeline", "com/mojang/renderpearl/api/pipeline/RenderPipeline") } }
	def expandProps = [
		version: project.version,
		component_version: selectedReleaseVersion,
		minecraft_depends: project.minecraft_depends,
        loader_depends: minecraftProfile == "26.3" ? ">=0.19.5" : minecraftProfile == "26.2" ? ">=0.19.3" : ">=0.19.0",
		safe_build: safeBuild,
		api_build: true,
		developer_build: developerBuild
	]
	inputs.properties expandProps

	filesMatching(["fabric.mod.json", "safariutils-build.properties"]) {
		org.gradle.api.file.FileCopyDetails details ->
		details.expand(expandProps)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

apply from: 'gradle/regressions.gradle'
ext.safariProvenanceRoot = projectDir
ext.safariProvenanceProfile = minecraftProfile
ext.safariProvenanceEdition = buildVariant
ext.safariProvenanceVersion = selectedReleaseVersion
apply from: 'gradle/provenance.gradle'

apply from: 'gradle/distribution.gradle'
